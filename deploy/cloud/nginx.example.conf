# Reverse proxy HTTPS (nginx pe host). Certificatul: certbot --nginx -d field.exemplu.ro (sau al tău).
# Aplicația ascultă pe 127.0.0.1:8080  =>  CIMITIR_PAIRING_TRUSTED_PROXIES=127.0.0.1
server {
    listen 80;
    server_name field.exemplu.ro;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name field.exemplu.ro;
    ssl_certificate     /etc/letsencrypt/live/field.exemplu.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/field.exemplu.ro/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # RESCRIE (nu adaugă la) X-Forwarded-For: clientul nu poate injecta intrări
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
