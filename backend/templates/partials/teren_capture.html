  <div class="tr-block hide" id="tr-block" data-testid="teren-blocked"></div>
  <button class="tr-btn alt hide" id="tr-retry-session" type="button" data-testid="teren-retry-session">Reîncearcă</button>

  <div class="tr-card hide" id="tr-pair" data-testid="teren-pair">
    <label for="tr-code">Cod de asociere (din MAIN)</label>
    <input id="tr-code" autocomplete="off" autocapitalize="characters" data-testid="teren-pair-code">
    <label for="tr-devname">Nume telefon</label>
    <input id="tr-devname" maxlength="60" value="Telefon" data-testid="teren-pair-name">
    <div class="tr-msg err hide" id="tr-pair-msg" data-testid="teren-pair-error"></div>
    <button class="tr-btn" id="tr-pair-btn" type="button" data-testid="teren-pair-btn">Asociază telefonul</button>
  </div>

  <div id="tr-main" class="hide">
    <div class="tr-card" data-testid="teren-grave-card">
      <div class="tr-row"><span>Cimitir</span><b id="tr-cem" data-testid="teren-cemetery"></b></div>
      <div class="tr-row"><span>Loc selectat</span><b id="tr-cod" data-testid="teren-grave-code"></b></div>
      <div class="tr-row"><span>grave_uid</span><b class="mono" id="tr-guid" data-testid="teren-grave-uid"></b></div>
      <label for="tr-q">Cod loc</label>
      <input id="tr-q" placeholder="ex. A-1-10" autocomplete="off" data-testid="teren-loc-input">
      {% if cfg.standalone %}
      <label for="tr-gid">grave_uid (identificatorul locului)</label>
      <input id="tr-gid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false" data-testid="teren-grave-uid-input">
      <button class="tr-btn alt" id="tr-find" type="button" data-testid="teren-loc-find">Selectează locul</button>
      {% else %}
      <button class="tr-btn alt" id="tr-find" type="button" data-testid="teren-loc-find">Caută locul</button>
      <a class="tr-btn alt" style="display:block;text-align:center;line-height:50px;text-decoration:none" href="/admin/harta" data-testid="teren-pick-on-map">Alege pe hartă</a>
      {% endif %}
    </div>

    <div class="tr-grid" data-testid="teren-menu">
      <button type="button" class="tr-tile" id="tile-DECEASED" data-type="DECEASED" data-testid="tile-deceased">Persoană înhumată</button>
      <button type="button" class="tr-tile" id="tile-WORK" data-type="WORK" data-testid="tile-work">Lucrare</button>
      <button type="button" class="tr-tile" id="tile-PERMIT" data-type="PERMIT" data-testid="tile-permit">Aviz</button>
      <button type="button" class="tr-tile" id="tile-DOCUMENT" data-type="DOCUMENT" data-testid="tile-document">Document</button>
      <button type="button" class="tr-tile" id="tile-GRAVE_PHOTO" data-type="GRAVE_PHOTO" data-testid="tile-grave-photo">Poză loc</button>
      <button type="button" class="tr-tile" id="tile-WORK_PHOTO" data-type="WORK_PHOTO" data-testid="tile-work-photo">Poză lucrare</button>
    </div>

    <div class="tr-card hide" id="tr-form" data-testid="teren-form">
      <div id="sec-DECEASED" class="hide">
        <label>Nume *</label><input name="nume" maxlength="200" data-testid="f-nume">
        <label>Prenume</label><input name="prenume" maxlength="200" data-testid="f-prenume">
        <label>Data nașterii</label><input name="data_nasterii" type="date" data-testid="f-data-nasterii">
        <label>Data decesului</label><input name="data_deces" type="date" data-testid="f-data-deces">
        <label>Data înhumării</label><input name="data_inhumare" type="date" data-testid="f-data-inhumare">
        <label>Sex</label><select name="sex" data-testid="f-sex"><option value=""></option><option value="M">M</option><option value="F">F</option></select>
        <label>Observații</label><textarea name="observatii" rows="2" maxlength="2000" data-testid="f-observatii-deceased"></textarea>
      </div>
      <div id="sec-WORK" class="hide">
        <label>Tip lucrare *</label><input name="descriere" list="tr-work-types" maxlength="2000" data-testid="f-tip-lucrare">
        <datalist id="tr-work-types"><option value="Curățare"><option value="Reparație monument"><option value="Amenajare"><option value="Turnare fundație"><option value="Montare cruce"></datalist>
        <label>Executant</label><input name="executant" maxlength="200" data-testid="f-executant">
        <label>Data început</label><input name="data_inceput" type="date" data-testid="f-data-inceput">
        <label>Data sfârșit</label><input name="data_sfarsit" type="date" data-testid="f-data-sfarsit">
        <label>Observații</label><textarea name="observatii" rows="2" maxlength="2000" data-testid="f-observatii-work"></textarea>
      </div>
      <div id="sec-PERMIT" class="hide">
        <label>Nr. aviz *</label><input name="nr_aviz" maxlength="200" data-testid="f-nr-aviz">
        <label>Data aviz</label><input name="data_aviz" type="date" data-testid="f-data-aviz">
        <label>Lucrare</label><input name="lucrare" maxlength="2000" data-testid="f-lucrare-aviz">
        <label>Observații</label><textarea name="observatii" rows="2" maxlength="2000" data-testid="f-observatii-permit"></textarea>
      </div>
      <div id="sec-DOCUMENT" class="hide">
        <label>Tip document *</label>
        <select name="doc_type" data-testid="f-doc-type"><option value=""></option>{% for v, l in doc_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
        <label>Descriere</label><input name="caption" maxlength="200" data-testid="f-caption-doc">
        <label>Nr. evidență</label><input name="nr_evidenta" maxlength="200" data-testid="f-nr-evidenta">
        <label>Fișier (PDF, JPEG, PNG) *</label><input type="file" accept="application/pdf,image/jpeg,image/png" data-testid="f-file-doc"><div class="tr-picked muted"></div>
      </div>
      <div id="sec-GRAVE_PHOTO" class="hide">
        <label>Fotografie loc *</label><input type="file" accept="image/*" capture="environment" data-testid="f-file-grave-photo"><div class="tr-picked muted"></div>
        <label>Descriere</label><input name="caption" maxlength="200" data-testid="f-caption-grave-photo">
      </div>
      <div id="sec-WORK_PHOTO" class="hide">
        <label>Etapa *</label>
        <select name="work_stage" data-testid="f-stage"><option value=""></option><option value="BEFORE">ÎNAINTE</option><option value="DURING">ÎN TIMPUL</option><option value="AFTER">DUPĂ</option></select>
        <label>Lucrare *</label><select name="target_uid" id="f-target" data-testid="f-target"></select>
        <label>Fotografie lucrare *</label><input type="file" accept="image/*" capture="environment" data-testid="f-file-work-photo"><div class="tr-picked muted"></div>
        <label>Descriere</label><input name="caption" maxlength="200" data-testid="f-caption-work-photo">
      </div>
      <div class="tr-msg hide" id="tr-msg" role="status"></div>
      <button class="tr-btn" id="tr-send" type="button" disabled data-testid="teren-send-btn">Trimite</button>
    </div>
  </div>
