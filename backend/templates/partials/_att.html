{% macro attbtn(etype, id, label='Atașamente') -%}
<button type="button" class="att-btn" onclick="event.stopPropagation();openAtt('{{ etype }}','{{ id }}')" data-testid="att-open-{{ etype }}-{{ id }}" title="{{ label }}"><i data-lucide="paperclip"></i><span>{{ label }}</span></button>
{%- endmacro %}
{% macro photobtn(etype, id, doc_type, label, icon='camera', cls='att-photo') -%}
<button type="button" class="att-btn {{ cls }}" onclick="event.stopPropagation();openAtt('{{ etype }}','{{ id }}','{{ doc_type }}')" data-testid="photo-{{ etype }}-{{ id }}-{{ doc_type }}"><i data-lucide="{{ icon }}"></i><span>{{ label }}</span></button>
{%- endmacro %}
